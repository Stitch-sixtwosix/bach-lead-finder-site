<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Layout: brand bar, overview figures, hearing agenda, filters, then list | map + detail.
   BACH Development brand: orange #FF8300, charcoal #51534A, slate #7B868C; Outfit + Inter */
:root{
  --ground:#f5f4f1; --surface:#ffffff; --sunk:#efeeea; --line:#e3e1dc; --line-strong:#d2cfc8;
  --ink:#24251f; --ink-2:#51534a; --mute:#6f7579;
  --orange:#ff8300; --orange-ink:#b85a00; --orange-wash:#fff1e3; --on-orange:#1f1300;
  --heard:#51534a; --vacant:#9aa3a8; --ok:#2f9e5b; --preapp:#b85a00;
  --map-land:#fbfaf8; --map-city:#f1efea; --map-road:#bdb6a8; --map-edge:#bdb8ad; --map-out:#e9e7e2; --map-out-edge:#d6d2ca; --map-hwy:#f2b36b; --map-major:#d8cfbf; --map-label:#3e4038; --map-halo:#fbfaf8;
  --logo-ink:#51534a; --logo-sub:#7b868c;
  --gut:max(24px, env(safe-area-inset-left, 0px)); --gut-r:max(24px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.23,1,.32,1);
  --display:Outfit, Inter, system-ui, sans-serif; --text:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121311; --surface:#1a1b19; --sunk:#222320; --line:#2c2e2a; --line-strong:#3a3c37;
  --ink:#ecebe7; --ink-2:#c4c3bd; --mute:#9a9f9c;
  --orange:#ff8f1a; --orange-ink:#ffaa55; --orange-wash:#2e2012; --on-orange:#1f1300;
  --heard:#c4c3bd; --vacant:#6f777b; --ok:#4cc27e; --preapp:#ffc27a;
  --map-land:#1d1e1b; --map-city:#242522; --map-road:#55574f; --map-edge:#4a4c46; --map-out:#161715; --map-out-edge:#2c2e2a; --map-hwy:#8a5a22; --map-major:#4a4a42; --map-label:#d8d6cf; --map-halo:#1d1e1b;
  --logo-ink:#ecebe7; --logo-sub:#9aa3a8; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#121311; --surface:#1a1b19; --sunk:#222320; --line:#2c2e2a; --line-strong:#3a3c37;
  --ink:#ecebe7; --ink-2:#c4c3bd; --mute:#9a9f9c;
  --orange:#ff8f1a; --orange-ink:#ffaa55; --orange-wash:#2e2012; --on-orange:#1f1300;
  --heard:#c4c3bd; --vacant:#6f777b; --ok:#4cc27e; --preapp:#ffc27a;
  --map-land:#1d1e1b; --map-city:#242522; --map-road:#55574f; --map-edge:#4a4c46; --map-out:#161715; --map-out-edge:#2c2e2a; --map-hwy:#8a5a22; --map-major:#4a4a42; --map-label:#d8d6cf; --map-halo:#1d1e1b;
  --logo-ink:#ecebe7; --logo-sub:#9aa3a8; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--text);-webkit-font-smoothing:antialiased}
::selection{background:var(--orange);color:var(--on-orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
.pad{padding-left:var(--gut);padding-right:var(--gut-r)}

/* shell */
.bar{display:flex;align-items:center;gap:20px;padding-block:12px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:1000}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1001;background:var(--surface)}
.bar .logo{height:30px;width:auto;display:block}
.bar .divider{width:1px;height:24px;background:var(--line)}
.bar h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
.sync{white-space:nowrap}
@media (max-width:1100px){.bar .scope{display:none}}
.bar .scope{color:var(--mute);font-size:13px}
.bar .grow{flex:1}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--vacant)}
.sync[data-state="live"] i{background:var(--ok)}
.sync[data-state="local"] i{background:var(--orange)}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:8px}

/* controls */
input,select,button,textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:8px;padding:7px 10px;transition:border-color 120ms ease,background-color 120ms ease,transform 140ms var(--ease)}
button{cursor:pointer}
button:active:not(:disabled){transform:scale(.97)}
button:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
@media (hover:hover){button:hover:not(:disabled),select:hover,input:hover{border-color:var(--mute)}}
input[type=checkbox]{accent-color:var(--orange);width:16px;height:16px;margin:0}
.btn-primary{background:var(--orange);border-color:var(--orange);color:var(--on-orange);font-weight:600}
@media (hover:hover){.btn-primary:hover:not(:disabled){border-color:var(--orange-ink)}}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;color:var(--mute);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.search{position:relative;flex:1 1 220px;min-width:180px;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{width:100%;padding-left:32px}
label.inline{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
label.inline input[type=number]{width:62px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--orange-wash);color:var(--orange-ink);border:1px solid transparent;
  border-radius:99px;padding:4px 6px 4px 11px;font-size:13px;font-weight:500}
.chip button{border:0;background:transparent;padding:0 4px;color:inherit;line-height:1}

/* overview */
.figs{display:flex;gap:40px;padding-block:20px 6px;flex-wrap:wrap}
.fig b{display:block;font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.fig span{color:var(--mute);font-size:12.5px}
.fig.lead b{color:var(--orange-ink)}

/* hearing agenda */
.agenda{padding-block:14px 4px}
.agenda-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.agenda-head h2{font-size:16px;font-weight:600;margin:0}
.agenda-head p{margin:0;color:var(--mute);font-size:13px}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px;min-width:0;display:flex;flex-direction:column}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.day header b{font-family:var(--display);font-size:15px;font-weight:600}
.day header span{font-size:12px;color:var(--mute);white-space:nowrap}
.day.soon header span{color:var(--orange-ink);font-weight:600}
.day ul{list-style:none;margin:0;padding:0}
.day li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:8px 6px;
  border-radius:6px;cursor:pointer;transition:background-color 100ms ease}
.day li + li button{border-top:1px solid var(--line)}
@media (hover:hover){.day li button:hover{background:var(--sunk)}}
.day li button:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.day li button[aria-current="true"]{background:var(--orange-wash)}
.day .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .what{grid-column:1;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .sc{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--display);font-weight:600}
.day .sc.hot{color:var(--orange-ink)}
.day .more{margin-top:auto;padding-top:6px}
.day .more button{width:100%;border:0;background:transparent;color:var(--orange-ink);font-weight:500;font-size:13px;padding:6px}
.agenda .none{color:var(--mute);background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:16px}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px 14px}
#export{margin-left:auto}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(360px,1fr);gap:16px;padding-bottom:24px;height:max(600px, calc(100vh - 140px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;min-width:0}
.tablewrap{overflow:auto;flex:1}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-weight:500;font-size:12.5px;color:var(--mute);
  padding:10px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;user-select:none}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
th[aria-sort] button[data-k]{color:var(--ink)}
th .info{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:3px;vertical-align:-4px;border-radius:50%;color:var(--mute);
  transition:color 120ms ease,background-color 120ms ease}
@media (hover:hover){th .info:hover{color:var(--orange-ink);background:var(--orange-wash)}}
th .info[aria-expanded="true"]{color:var(--orange-ink);background:var(--orange-wash)}
.tip{position:fixed;z-index:2000;width:min(340px, calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);
  border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:13px;line-height:1.5;white-space:normal;
  transform-origin:top left;animation:tipin 140ms var(--ease)}
@keyframes tipin{from{opacity:0;transform:scale(.97)}}
.tip h4{margin:0 0 4px;font:600 14px var(--display)}
.tip p{margin:0 0 8px;color:var(--ink-2)}
.tip ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.tip li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.tip li b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.tip li b.up{color:var(--ok)}
.tip li b.down{color:#c4402f}
.tip .foot{margin-top:8px;color:var(--mute);font-size:12px}
th.r,td.r{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer;transition:background-color 100ms ease}
@media (hover:hover){tr.row:hover{background:var(--sunk)}}
tr.row.sel{background:var(--orange-wash)}
tr.row.sel td:first-child{box-shadow:inset 2px 0 0 var(--orange)}
.score{font-family:var(--display);font-weight:600;font-size:16px}
.score.hot{color:var(--orange-ink)}
.stage{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.sub{color:var(--mute);font-size:12.5px}
.status{font-size:12px;color:var(--ink-2);white-space:nowrap}
.status.active{color:var(--orange-ink);font-weight:600}
.show-sm{display:none}
.empty{padding:48px 24px;text-align:center;color:var(--mute)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

#map{flex:1 1 58%;min-height:340px;background:var(--ground)}
.mlabel{white-space:nowrap;pointer-events:none}
.mlabel span{display:inline-block;transform:translate(-50%,-50%);font:500 11px/1.1 var(--text);color:var(--map-label);
  text-shadow:0 0 2px var(--map-halo),0 0 2px var(--map-halo),0 0 3px var(--map-halo),0 0 4px var(--map-halo)}
.mlabel.city span{font-weight:600;font-size:12px}
.mlabel.big span{font-size:13.5px;font-weight:700}
.mlabel.hood span{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.mlabel.street span{font-size:10.5px;color:var(--ink-2)}
.mlabel.hwy span{font-size:10.5px;font-weight:700;color:var(--orange-ink)}
.map-bar{display:flex;align-items:center;gap:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.map-bar .seg button{padding:4px 12px;font-size:13px}
.cov-sum{font-size:13px}
.cov-sum h3{margin:0 0 4px;font-size:15px}
.cov-sum p{margin:0 0 10px;color:var(--mute)}
.cov-sum table{width:100%;border-collapse:collapse}
.cov-sum td,.cov-sum th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.cov-sum th{color:var(--mute);font-size:12px;position:static}
.cov-sum td.r,.cov-sum th.r{text-align:right}
.cov-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.cov-bar i{display:block;height:100%;background:var(--ok)}
.k-sq{width:10px;height:10px;border-radius:2px;display:inline-block}
.map-key{display:flex;flex-wrap:wrap;gap:4px 16px;padding:6px 12px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.map-key span{display:inline-flex;align-items:center;gap:6px}
.k-dot{width:10px;height:10px;border-radius:50%;background:var(--orange);display:inline-block}
.k-dot.k-approx{background:transparent;border:1.5px dashed var(--orange)}
.leaflet-container{font:inherit;background:var(--ground)}
.leaflet-tooltip{font:12.5px var(--text);border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.leaflet-tooltip.city{background:transparent;border:0;box-shadow:none;color:var(--mute);font-weight:500;font-size:12px;letter-spacing:.02em}
.leaflet-tooltip.city::before{display:none}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-color:var(--line)!important}
.leaflet-control-attribution{background:transparent!important;color:var(--mute)!important}

.detail{flex:1 1 42%;border-top:1px solid var(--line);padding:16px 18px;overflow:auto}
.detail.enter{animation:in 180ms var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.detail h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.detail .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 14px;font-size:13px;color:var(--mute)}
.detail .meta b{color:var(--orange-ink);font-family:var(--display);font-size:15px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--mute)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.why{margin:14px 0 0;padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:13px;color:var(--ink-2)}
.breakdown{margin:14px 0 0;padding:12px 14px;background:var(--sunk);border-radius:8px;font-size:13px}
.breakdown h3{margin:0 0 6px;font-size:13px;font-weight:600}
.breakdown ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.breakdown li{display:grid;grid-template-columns:40px 1fr;gap:8px;color:var(--ink-2)}
.breakdown li b{text-align:right;font-weight:600}
.breakdown b.up{color:var(--ok)}
.breakdown b.down{color:#c4402f}
.breakdown .total{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line-strong);font-weight:600}
.breakdown .total b{white-space:nowrap}
.breakdown .total small{font-weight:400;color:var(--mute)}
.breakdown .cat{padding:8px 0;border-top:1px solid var(--line)}
.breakdown .cat:first-of-type{border-top:0;padding-top:2px}
.breakdown .cat-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;color:var(--ink)}
.breakdown .cat-head small{font-weight:400;color:var(--mute)}
.breakdown .meter{height:4px;background:var(--line);border-radius:2px;margin:5px 0 6px;overflow:hidden}
.breakdown .meter i{display:block;height:100%;background:var(--orange);border-radius:2px}
.breakdown .none{margin:0;color:var(--mute);font-size:12.5px}
.tip .cat-title{margin:10px 0 4px;font-weight:600;color:var(--ink)}
.tip .cat-title span{font-weight:400;color:var(--mute)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links a{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;
  border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;transition:border-color 120ms ease}
@media (hover:hover){.links a:hover{border-color:var(--orange)}}
.track{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.track-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.track h3{font-size:14px;margin:0;font-weight:600}
.track .seg{flex-wrap:wrap}
.track textarea{width:100%;margin-top:10px;min-height:72px;resize:vertical}
.saved{font-size:12px;color:var(--mute);margin-top:4px;min-height:18px}
.placeholder{color:var(--mute);display:grid;place-items:center;height:100%;text-align:center;padding:20px}

@media (max-width:1000px){
  .work{grid-template-columns:1fr;height:auto}
  .tablewrap{max-height:65vh}
  #map{height:320px;flex:none}
}
@media (max-width:640px){
  :root{--gut:max(16px, env(safe-area-inset-left, 0px));--gut-r:max(16px, env(safe-area-inset-right, 0px))}
  .bar .scope,.bar .divider,.sync span{display:none}
  .figs{gap:22px}
  .fig b{font-size:24px}
  .days{grid-auto-columns:minmax(78%,1fr)}
  .hide-sm{display:none}
  .show-sm{display:inline}
  td,th{padding:9px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script type="module">
// lead data and the drawn map are published as files next to this page
$rows_loading();
function $rows_loading() { document.getElementById("rows").innerHTML = `<tr><td colspan="6" class="empty"><strong>Loading leads…</strong></td></tr>`; }
let DATA, BASEMAP;
try {
  [DATA, BASEMAP] = await Promise.all([fetch("leads.json").then(r => r.json()), fetch("basemap.json").then(r => r.json())]);
} catch (e) {
  document.getElementById("rows").innerHTML = `<tr><td colspan="6" class="empty"><strong>Couldn't load the leads.</strong>Reload the page to try again.</td></tr>`;
  throw e;
}
const TEXT_FIELDS = ["owner","owner_mail","applicant","site_address","location","land_use","rep_name","rep_phone","purpose","source_url",
  "sunbiz_url","hearing_date","last_sale_date","folios","uses","state","case_id","case_type"];
const CATS = [["Timing", 35], ["Size", 25], ["Project fit", 20], ["Developer", 10], ["Land readiness", 10]];
const STATUSES = ["New","Researching","Contacted","Meeting set","Bidding","Won","Lost","Pass"];
const ACTIVE = ["Contacted","Meeting set","Bidding"];
const STAGE = {"Pre-application":{v:"--preapp",short:"Pre-app"},"Pending hearing":{v:"--orange",short:"Pending"},"Recently heard":{v:"--heard",short:"Heard"},"Approved PD, still vacant":{v:"--vacant",short:"Approved, vacant"}};
const TYPE_NAMES = {"RZ-PD":"PD / PUD","MM":"PD major modification","DRI":"Regional development (DRI)","RZ-STD":"Rezoning","PRS":"PD minor change","PD-APPROVED":"Adopted PD","SITE":"Site plan / subdivision","ANNEX":"Annexation"};
const STATE_NAMES = {"AL":"Alabama","AK":"Alaska","AZ":"Arizona","AR":"Arkansas","CA":"California","CO":"Colorado","CT":"Connecticut","DE":"Delaware","DC":"District of Columbia","FL":"Florida","GA":"Georgia","HI":"Hawaii","ID":"Idaho","IL":"Illinois","IN":"Indiana","IA":"Iowa","KS":"Kansas","KY":"Kentucky","LA":"Louisiana","ME":"Maine","MD":"Maryland","MA":"Massachusetts","MI":"Michigan","MN":"Minnesota","MS":"Mississippi","MO":"Missouri","MT":"Montana","NE":"Nebraska","NV":"Nevada","NH":"New Hampshire","NJ":"New Jersey","NM":"New Mexico","NY":"New York","NC":"North Carolina","ND":"North Dakota","OH":"Ohio","OK":"Oklahoma","OR":"Oregon","PA":"Pennsylvania","RI":"Rhode Island","SC":"South Carolina","SD":"South Dakota","TN":"Tennessee","TX":"Texas","UT":"Utah","VT":"Vermont","VA":"Virginia","WA":"Washington","WV":"West Virginia","WI":"Wisconsin","WY":"Wyoming"};
const BACH = new Set(["AZ", "CO", "FL", "GA", "ID", "IL", "IN", "KS", "KY", "MI", "MN", "MO", "NC", "NV", "OH", "OR", "SC", "TN", "TX", "UT", "WA", "WI", "WY"]);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = (s, n=56) => s.length > n ? s.slice(0, n-1).trimEnd() + "…" : s;
const money = n => +n ? "$" + Math.round(+n).toLocaleString() : "—";
const title = s => (s||"").toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase()).replace(/\b(Llc|Lp|Inc|Ii|Iii|Pd|Fl|Us)\b/g, m => m.toUpperCase());
const owner1 = l => title((l.owner || "").split(";")[0]) || (l.applicant ? title(l.applicant) : "") || "Not identified yet";
const fmtDate = d => d ? new Date(d + "T12:00").toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"}) : "—";
const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : new Date(iso).toLocaleDateString([], {month:"short", day:"numeric"}); };

const leads = DATA.leads.map(l => {
  const o = {...Object.fromEntries(TEXT_FIELDS.map(k => [k, ""])), units:0, sqft:0, just_value:0, bldg_value:0, last_sale_price:0,
             filings:1, pts:[], pen:[], ...l};
  o.score = +o.score; o.acres = +o.acres || 0;
  o.key = o.id.replace(/[^A-Za-z0-9_\-.~:@+]/g, "-").slice(0, 190);
  // plain-text reasons for the export, built from the breakdown
  o.reasons = CATS.map(([n, m], i) => `${n} ${(o.pts[i] || [0])[0]}/${m}`).concat(o.pen.map(([n, t]) => `${n} ${t}`)).join("; ");
  return o;
});

/* ---------- pursuit storage: shared db when available, this browser otherwise ---------- */
const LKEY = "bach.leadfinder.tracking.v2";
let local = {}; try { local = JSON.parse(localStorage.getItem(LKEY) || "{}"); } catch (e) {}
const store = { mode:"wait", shared:{}, db:null, user:null, me:null, canWrite:true };
const rec = l => (store.mode === "shared" ? store.shared[l.key] : local[l.key]) || {};
const statusOf = l => rec(l).status || "New";
function setSync(state, text) { $("#sync").dataset.state = state; $("#sync-text").textContent = text; }

(async () => {
  let db = null, user = null;
  try { db = await window.claude?.use?.("db"); user = await window.claude?.use?.("user"); } catch (e) {}
  if (!db) { store.mode = "local"; setSync("local", "Saved in this browser only"); render(); return; }
  store.db = db; store.user = user;
  store.me = user ? await user.id() : null;
  const cw = user ? await user.can("data.write") : null;
  store.canWrite = cw !== false;
  const timer = setTimeout(() => setSync("wait", "Can't reach team notes yet"), 10000);
  db.collection("pursuit").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    store.shared = next; store.mode = "shared";
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync("live", store.canWrite ? "Shared with your team" : "Team notes, view only"); }
    render();
    if (selId) refreshTrack();
  }, () => { clearTimeout(timer); setSync("local", "Team notes unavailable"); });
})();

const pending = {};                          // one write at a time per lead
function save(l, patch) {
  const body = {...rec(l), ...patch, at:new Date().toISOString()};
  if (store.mode !== "shared") {
    local[l.key] = body;
    try { localStorage.setItem(LKEY, JSON.stringify(local)); return Promise.resolve("Saved in this browser"); }
    catch (e) { return Promise.resolve("Couldn't save. Your browser is blocking storage."); }
  }
  if (store.me) body.by = store.me;
  store.shared[l.key] = body;
  const run = () => store.db.collection("pursuit").doc(l.key).set(body)
    .then(() => "Saved for the team")
    .catch(e => { if (e && e.code === "invalid_argument") { store.canWrite = false; return "You have view-only access, so this wasn't saved."; }
                  if (e && e.code === "quota_exceeded") return "The shared notes are full. Ask the owner to clear old leads.";
                  return "Couldn't save just now. Try again in a moment."; });
  pending[l.key] = (pending[l.key] || Promise.resolve()).then(run, run);
  return pending[l.key];
}

/* ---------- filters ---------- */
const areas = [...new Set(leads.map(l => l.jurisdiction))].sort();
const states = [...new Set(leads.map(l => l.state).filter(Boolean))].sort((a, b) => STATE_NAMES[a].localeCompare(STATE_NAMES[b]));
$("#scope").textContent = `${states.length} states · ${areas.length} counties and cities · ${leads.length.toLocaleString()} sites · updated ${new Date(DATA.generated).toLocaleDateString([], {month:"short", day:"numeric"})}`;
const fill = (sel, vals, label = v => v) => vals.forEach(v => sel.insertAdjacentHTML("beforeend", `<option value="${esc(v)}">${esc(label(v))}</option>`));
fill($("#type"), [...new Set(leads.map(l => l.case_type))].sort((a, b) => (TYPE_NAMES[a] || a).localeCompare(TYPE_NAMES[b] || b)), v => TYPE_NAMES[v] || v);
fill($("#status"), STATUSES);
function fillStates() {
  const sel = $("#state"), terr = $("#territory").value, keep = sel.value;
  sel.innerHTML = `<option value="">All states</option>`;
  // every state is listed, even with no leads yet, so gaps are visible
  const counts = {}; leads.forEach(l => counts[l.state] = (counts[l.state] || 0) + 1);
  const all = Object.keys(STATE_NAMES).sort((a, b) => STATE_NAMES[a].localeCompare(STATE_NAMES[b]));
  fill(sel, all.filter(v => terr !== "bach" || BACH.has(v)), v => `${STATE_NAMES[v]} (${(counts[v] || 0).toLocaleString()}${counts[v] ? "" : " — not covered yet"})`);
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
}
function fillAreas() {
  const st = $("#state").value, terr = $("#territory").value, sel = $("#juris");
  sel.innerHTML = `<option value="">All counties and cities</option>`;
  fill(sel, areas.filter(a => leads.some(l => l.jurisdiction === a && (!st || l.state === st) && (terr !== "bach" || BACH.has(l.state)))));
}
fillStates();
fillAreas();
$("#territory").addEventListener("input", () => { fillStates(); fillAreas(); fitted = false; selId = null; drawBase(); render(); });
$("#state").addEventListener("input", () => { fillAreas(); fitted = false; selId = null; drawBase(); render(); });
$("#juris").addEventListener("input", () => { fitted = false; });

let sortK = "score", sortDir = -1, selId = null, dayFilter = null;
const stagesOn = () => [...document.querySelectorAll("[data-stage][aria-pressed=true]")].map(b => b.dataset.stage);

function baseFiltered() {
  const q = $("#q").value.trim().toLowerCase(), st = stagesOn(), ty = $("#type").value, ju = $("#juris").value, sa = $("#state").value, terr = $("#territory").value,
        ss = $("#status").value, ms = +$("#minScore").value || 0, ma = +$("#minAcres").value || 0, co = $("#company").checked;
  return leads.filter(l =>
    st.includes(l.stage) && (!ty || l.case_type === ty) && (!ju || l.jurisdiction === ju) && (!sa || l.state === sa) && (terr !== "bach" || BACH.has(l.state)) &&
    (!ss || statusOf(l) === ss) && l.score >= ms && l.acres >= ma && (!co || l.owner_is_entity || !(l.owner || l.applicant)) &&
    (!q || [l.owner, l.applicant, l.site_address, l.location, l.case_id, l.rep_name, l.owner_mail, l.jurisdiction, l.purpose, l.uses]
      .join(" ").toLowerCase().includes(q)));
}
function filtered() {
  const out = baseFiltered().filter(l => !dayFilter || (l.stage === "Pending hearing" && l.hearing_date === dayFilter));
  out.sort((a, b) => {
    const va = sortK === "status" ? statusOf(a) : a[sortK], vb = sortK === "status" ? statusOf(b) : b[sortK];
    return (va > vb ? 1 : va < vb ? -1 : 0) * sortDir || b.score - a.score;
  });
  return out;
}

/* ---------- map: drawn basemap (no outside tiles) ----------
   Layers, back to front: states and county lines (basemap.json), freeways, county street detail
   (map/<FIPS>.json from OpenStreetMap, loaded when zoomed in), lead pins, then text labels. */
const map = L.map("map", {zoomControl:true, attributionControl:true, zoomSnap:.25, minZoom:3, maxZoom:15}).setView([38.5, -96], 4);
map.attributionControl.setPrefix(false).addAttribution("© OpenStreetMap contributors · Esri · US Census");
for (const [name, z] of [["basemap", 300], ["streets", 350], ["pins", 450]]) map.createPane(name).style.zIndex = z;
const baseRenderer = L.canvas({pane:"basemap"}), streetRenderer = L.canvas({pane:"streets", padding:.3}), pinRenderer = L.canvas({pane:"pins"});
let base, highways, stateLayers = {};
const ORDER = {states:0, counties:1, county:2};
const areas_ = BASEMAP.features.filter(f => ORDER[f.properties.kind] !== undefined).sort((a, b) => ORDER[a.properties.kind] - ORDER[b.properties.kind]);
const freeways = BASEMAP.features.filter(f => f.properties.kind === "freeways");
const cityLabels = BASEMAP.features.filter(f => f.properties.kind === "label");
function drawBase() {
  if (base) map.removeLayer(base);
  if (highways) map.removeLayer(highways);
  stateLayers = {};
  const pick = $("#state") ? $("#state").value : "";
  base = L.geoJSON({type:"FeatureCollection", features:areas_}, {interactive:false, renderer:baseRenderer, pane:"basemap", style: f => {
    const k = f.properties.kind;
    if (k === "counties") return {color:css("--map-out-edge"), weight:.6, fill:false, opacity:1};
    if (k === "states") {
      const on = pick && f.properties.name === pick, ours = $("#territory").value !== "bach" || f.properties.bach !== false;
      // with "BACH territory" chosen, the other states step back; the chosen state is outlined in orange
      return {color: on ? css("--orange") : ours ? css("--map-edge") : css("--map-out-edge"), weight: on ? 2.5 : ours ? 1 : .8,
              fillColor: !ours ? css("--map-out") : pick && !on ? css("--map-city") : css("--map-land"), fillOpacity:1};
    }
    return {color:css("--map-edge"), weight:1, fill:false};
  }, onEachFeature: (f, lyr) => {
    if (f.properties.kind === "states") stateLayers[f.properties.name] = lyr;
  }}).addTo(map);
  highways = L.geoJSON({type:"FeatureCollection", features:freeways}, {interactive:false, renderer:streetRenderer, pane:"streets",
    style: () => ({color:css("--map-hwy"), weight: map.getZoom() < 7 ? 1 : 1.8, opacity:.9})}).addTo(map);
  Object.values(streetLayers).forEach(g => g.remove()); streetLayers = {}; refreshDetail();
}

/* county street detail, loaded on demand */
let INDEX = [], streetLayers = {}, streetData = {};
const ROAD_STYLE = {1:[3.2, "--map-hwy"], 2:[2.6, "--map-hwy"], 3:[2, "--map-major"], 4:[1.5, "--map-major"], 5:[1, "--map-road"]};
fetch("map/index.json").then(r => r.ok ? r.json() : []).then(d => { INDEX = d; refreshDetail(); }).catch(() => {});
async function loadCounty(c) {
  if (streetData[c.fips] !== undefined) return streetData[c.fips];
  streetData[c.fips] = null;
  try { streetData[c.fips] = await (await fetch(`map/${c.fips}.json`)).json(); } catch (e) { delete streetData[c.fips]; }
  return streetData[c.fips];
}
function drawCounty(fips) {
  const d = streetData[fips]; if (!d || streetLayers[fips]) return;
  const g = L.layerGroup();
  // one combined line per road class (fast to draw); minor roads first so highways sit on top
  const byCls = {};
  d.roads.forEach(([cls, , pts]) => (byCls[cls] ||= []).push(pts.map(([x, y]) => [y, x])));
  [5, 4, 3, 2, 1].forEach(cls => {
    if (!byCls[cls]) return;
    const [w, v] = ROAD_STYLE[cls];
    L.polyline(byCls[cls], {renderer:streetRenderer, pane:"streets", interactive:false, color:css(v), weight:w, opacity:1, cls,
      lineCap:"round", lineJoin:"round"}).addTo(g);
  });
  streetLayers[fips] = g.addTo(map);
}
function refreshDetail() {
  const z = map.getZoom(), b = map.getBounds();
  if (z >= 8.5) {
    INDEX.filter(c => b.intersects([[c.bbox[1], c.bbox[0]], [c.bbox[3], c.bbox[2]]]))
         .forEach(c => loadCounty(c).then(() => { drawCounty(c.fips); styleStreets(); drawLabels(); }));
  }
  Object.entries(streetLayers).forEach(([f, g]) => { if (z < 8.5) { g.remove(); delete streetLayers[f]; } });
  styleStreets();
  drawLabels();
}
function styleStreets() {
  const z = map.getZoom(), k = z < 10 ? .6 : z < 12 ? .8 : z < 14 ? 1 : 1.3;
  Object.values(streetLayers).forEach(g => g.eachLayer(l => {
    const cls = l.options.cls, hide = (cls === 5 && z < 11) || (cls === 4 && z < 9.5);
    l.setStyle({weight: hide ? 0 : (ROAD_STYLE[cls] || ROAD_STYLE[5])[0] * k, opacity: hide ? 0 : 1});
  }));
}

/* text labels: cities from the Census, towns / neighbourhoods / street names from OpenStreetMap */
const labelLayer = L.layerGroup().addTo(map);
function drawLabels() {
  labelLayer.clearLayers();
  const z = map.getZoom(), b = map.getBounds().pad(.05), taken = new Set();
  const place = (lat, lon, text, cls, w = 90, h = 22) => {
    if (!b.contains([lat, lon])) return;
    const p = map.latLngToContainerPoint([lat, lon]), cell = `${Math.floor(p.x / w)}:${Math.floor(p.y / h)}`;
    if (taken.has(cell)) return;
    taken.add(cell);
    L.marker([lat, lon], {interactive:false, keyboard:false, pane:"markerPane",
      icon: L.divIcon({className:`mlabel ${cls}`, html:`<span>${esc(text)}</span>`, iconSize:null})}).addTo(labelLayer);
  };
  const loaded = Object.keys(streetLayers).length > 0;
  // street names (zoomed in): one label per name in view, on its longest piece
  if (z >= 12.5) {
    const best = {};
    Object.keys(streetLayers).forEach(f => (streetData[f]?.roads || []).forEach(([cls, name, pts]) => {
      if (!name || (cls === 5 && z < 13.5) || pts.length < 2) return;
      const mid = pts[Math.floor(pts.length / 2)];
      if (!b.contains([mid[1], mid[0]])) return;
      const len = Math.abs(pts[0][0] - pts.at(-1)[0]) + Math.abs(pts[0][1] - pts.at(-1)[1]);
      if (!best[name] || best[name].len < len) best[name] = {len, cls, mid};
    }));
    Object.entries(best).sort((a, b) => a[1].cls - b[1].cls).forEach(([name, r]) => place(r.mid[1], r.mid[0], name, r.cls <= 2 ? "hwy" : "street", 110, 20));
  }
  // towns and neighbourhoods from OpenStreetMap where detail is loaded
  if (loaded) {
    Object.keys(streetLayers).forEach(f => (streetData[f]?.places || [])
      .filter(([rank]) => rank <= (z < 10 ? 2 : z < 11.5 ? 3 : 4)).sort((a, b) => a[0] - b[0])
      .forEach(([rank, name, x, y]) => place(y, x, name, rank <= 1 ? "city big" : rank <= 2 ? "city" : "hood")));
  }
  // cities from the Census everywhere else
  const minPop = z < 5 ? 1e6 : z < 6 ? 400000 : z < 7 ? 200000 : z < 8 ? 100000 : z < 9 ? 50000 : 20000;
  if (!(loaded && z >= 10)) cityLabels.filter(f => f.properties.pop >= minPop).sort((a, b) => b.properties.pop - a.properties.pop)
    .forEach(f => place(f.geometry.coordinates[1], f.geometry.coordinates[0], f.properties.name, f.properties.pop >= 250000 ? "city big" : "city"));
}

drawBase();
const layer = L.layerGroup().addTo(map);
let fitted = false;
map.on("zoomend", () => { resizePins(); highways && highways.setStyle({weight: map.getZoom() < 7 ? 1 : 1.8}); });
map.on("moveend", refreshDetail);
const pinRadius = l => { const z = map.getZoom(), k = z < 6 ? .45 : z < 8 ? .65 : z < 11 ? .85 : 1.1;
  return Math.max(2.5, (3 + Math.min(9, Math.sqrt(l.acres || 1))) * k); };
let pins = [];
function resizePins() { pins.forEach(([m, l]) => m.setRadius(pinRadius(l))); }

/* ---------- hearing agenda ---------- */
function renderAgenda(list) {
  const today = new Date(); today.setHours(0,0,0,0);
  const groups = {};
  list.filter(l => l.stage === "Pending hearing" && l.hearing_date && new Date(l.hearing_date + "T12:00") >= today)
      .forEach(l => (groups[l.hearing_date] ||= []).push(l));
  const dates = Object.keys(groups).sort();
  const total = dates.reduce((s, d) => s + groups[d].length, 0);
  $("#agenda-sub").textContent = dates.length
    ? `${total} site${total === 1 ? "" : "s"} on ${dates.length} hearing day${dates.length === 1 ? "" : "s"}, best leads first. Reach the owner before the vote.`
    : "";
  if (!dates.length) { $("#days").innerHTML = `<div class="none">No pending hearings match the filters. Turn on Pending or lower the score.</div>`; return; }
  $("#days").innerHTML = dates.map(d => {
    const items = groups[d].sort((a, b) => b.score - a.score), dt = new Date(d + "T12:00");
    const days = Math.round((dt - today) / 864e5);
    const when = days === 0 ? "Today" : days === 1 ? "Tomorrow" : `in ${days} days`;
    const shown = items.slice(0, 4);
    return `<article class="day${days <= 14 ? " soon" : ""}" aria-label="Hearing ${fmtDate(d)}">
      <header><b>${dt.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"})}</b><span>${when} · ${items.length} site${items.length === 1 ? "" : "s"}</span></header>
      <ul>${shown.map(l => `<li><button data-id="${esc(l.id)}"${l.id === selId ? ' aria-current="true"' : ""}>
        <span class="who">${esc(owner1(l))}</span>
        <span class="sc num${l.score >= 60 ? " hot" : ""}">${l.score}</span>
        <span class="what">${l.acres.toFixed(1)} ac · ${esc(TYPE_NAMES[l.case_type] || l.case_type)}</span></button></li>`).join("")}</ul>
      ${items.length > shown.length ? `<div class="more"><button data-day="${d}">Show all ${items.length} in the list</button></div>` : ""}
    </article>`;
  }).join("");
}

/* ---------- render ---------- */
function render() {
  const list = filtered();
  $("#k-total").textContent = list.length.toLocaleString();
  $("#k-pending").textContent = list.filter(l => l.stage === "Pending hearing" || l.stage === "Pre-application").length;
  $("#k-acres").textContent = Math.round(list.reduce((s, l) => s + l.acres, 0)).toLocaleString();
  $("#k-worked").textContent = leads.filter(l => ACTIVE.includes(statusOf(l))).length;
  $("#dayChip").innerHTML = dayFilter ? `<span class="chip">Hearing ${fmtDate(dayFilter)}<button aria-label="Clear hearing day">×</button></span>` : "";

  $("#rows").innerHTML = list.map(l => {
    const st = statusOf(l), S = STAGE[l.stage];
    return `<tr class="row${l.id === selId ? " sel" : ""}" data-id="${esc(l.id)}" tabindex="0">
      <td class="r"><span class="score num${l.score >= 60 ? " hot" : ""}">${l.score}</span></td>
      <td><span class="stage"><span class="dot" style="background:var(${S.v})"></span>${S.short}</span>
          <div class="sub num">${esc(l.case_type)} ${esc(l.case_id.split(",")[0])}${l.filings > 1 ? ` +${l.filings - 1}` : ""}${l.hearing_date ? ` · ${fmtDate(l.hearing_date)}` : ""}</div></td>
      <td>${esc(short(title(l.site_address || l.location || "—")))}<div class="sub">${esc((l.land_use || "").toLowerCase())}<span class="show-sm"> · ${l.acres.toFixed(1)} ac</span></div></td>
      <td class="r num hide-sm">${l.acres.toFixed(1)}</td>
      <td>${esc(short(owner1(l), 40))}</td>
      <td class="hide-sm"><span class="status${ACTIVE.includes(st) ? " active" : ""}">${esc(st)}</span></td></tr>`;
  }).join("");
  $("#empty").hidden = list.length > 0;
  document.querySelectorAll("th button[data-k]").forEach(b => {
    const th = b.parentElement;
    if (b.dataset.k === sortK) th.setAttribute("aria-sort", sortDir < 0 ? "descending" : "ascending"); else th.removeAttribute("aria-sort");
  });

  layer.clearLayers();
  pins = [];
  const pts = [], early = l => l.stage === "Pending hearing" || l.stage === "Pre-application";
  // draw early-stage and higher-scoring pins last so they sit on top
  list.slice().sort((a, b) => (early(a) - early(b)) || (a.score - b.score)).forEach(l => {
    if (l.lat == null) return;
    const c = css(STAGE[l.stage].v), sel = l.id === selId;
    const m = L.circleMarker([l.lat, l.lon], {renderer:pinRenderer, pane:"pins", radius: pinRadius(l), color: sel ? css("--ink") : c,
      fillColor:c, fillOpacity: l.approx ? .12 : early(l) ? .85 : .5, weight: sel ? 3 : l.approx ? 1.2 : 1,
      dashArray: l.approx ? "2 2" : null}).addTo(layer);
    m.bindTooltip(`${esc(owner1(l))} · ${l.score}${l.approx ? `<br><span class="sub">Approximate: somewhere in ${esc(l.jurisdiction)}</span>` : ""}`);
    m.on("click", () => select(l.id, true));
    pins.push([m, l]);
    pts.push([l.lat, l.lon]);
  });
  if (!fitted) {
    const st = $("#state").value, area = $("#juris").value || $("#q").value.trim();
    if (st && !area && stateLayers[st]) map.fitBounds(stateLayers[st].getBounds(), {padding:[16, 16]});
    else if (!st && !area && $("#territory").value === "bach")
      map.fitBounds(L.featureGroup([...BACH].filter(k => stateLayers[k]).map(k => stateLayers[k])).getBounds(), {padding:[8, 8]});
    else if (!st && !area) map.fitBounds([[24.4, -125], [49.4, -66.9]], {padding:[8, 8]});  // lower 48
    else if (pts.length) map.fitBounds(pts, {padding:[24, 24], maxZoom: pins.some(([, l]) => l.approx) ? 9 : 12});
    fitted = true;
  }
  if (mapMode === "coverage") { renderAgenda(baseFiltered()); return; }
  const exact = pins.filter(([, l]) => !l.approx).length;
  $("#map").setAttribute("aria-label", `Map of ${pts.length} leads, ${exact} at their exact address`);
  $("#map-key").innerHTML = `<span><i class="k-dot"></i>Exact address (${exact.toLocaleString()})</span>
    <span><i class="k-dot k-approx"></i>Approximate, in its city or county (${(pts.length - exact).toLocaleString()})</span>`;
  renderAgenda(baseFiltered());
}

/* ---------- detail ---------- */
async function trackMeta(l) {
  const r = rec(l);
  if (!r.at) return "";
  let who = "";
  if (store.mode === "shared" && r.by && store.user) {
    if (r.by === store.me) who = "you";
    else { const ps = await store.user.profiles([r.by]); who = (ps[r.by] && ps[r.by].name) || "a teammate"; }
  }
  return `Updated ${who ? "by " + who + " " : ""}${ago(r.at)}`;
}
async function refreshTrack() {
  const l = leads.find(x => x.id === selId); if (!l) return;
  const r = rec(l);
  document.querySelectorAll("#detail [data-s]").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === (r.status || "New")));

  if (ta && document.activeElement !== ta && ta.value !== (r.notes || "")) ta.value = r.notes || "";

    <div class="foot">Below the stage: case type, case number (+N means more filings on the same site) and hearing date.</div>`,
  site: `<h4>Site</h4><p>The street address, or the location described in the case (such as "southeast corner of 19th Ave and Baseline Rd"). The second line is the land use on record or what the applicant plans to build.</p>`,
  acres: `<h4>Acres</h4><p>Size of the land in the case, from the property appraiser or the agenda text. 0.0 means the agenda didn't state it; open the official record for the site plan.</p>`,
  owner: `<h4>Owner</h4><p>The property owner from the county's parcel records where we have them (Hillsborough today). Elsewhere it shows the applicant named on the agenda, often the developer or their LLC.</p>
    <div class="foot">"Hide individual and government owners" keeps sites where no owner has been found yet.</div>`,
  status: `<h4>Status</h4><p>Your team's progress on this lead: New, Researching, Contacted, Meeting set, Bidding, Won, Lost or Pass. Set it in the lead panel. Everyone with the link sees the same status.</p>`,
};
const infoIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>`;
document.querySelectorAll("th .info").forEach(b => b.innerHTML = infoIcon);
let tip = null, tipBtn = null;
function closeTip() { if (tip) { tip.remove(); tip = null; } if (tipBtn) { tipBtn.setAttribute("aria-expanded", "false"); tipBtn = null; } }
document.addEventListener("click", e => {
  const b = e.target.closest("th .info");
  if (!b) { if (tip && !e.target.closest(".tip")) closeTip(); return; }
  e.stopPropagation();
  if (tipBtn === b) return closeTip();
  closeTip();
  tip = document.createElement("div");
  tip.className = "tip"; tip.id = "tip"; tip.setAttribute("role", "dialog"); tip.setAttribute("aria-label", b.getAttribute("aria-label"));
  tip.innerHTML = INFO[b.dataset.info];
  document.body.appendChild(tip);
  const r = b.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let left = Math.min(Math.max(16, r.left - 12), innerWidth - w - 16);
  let top = r.bottom + 8;
  if (top + h > innerHeight - 16) top = Math.max(16, r.top - h - 8);
  tip.style.left = left + "px"; tip.style.top = top + "px";
  tip.style.maxHeight = (innerHeight - 32) + "px"; tip.style.overflow = "auto";
  b.setAttribute("aria-expanded", "true"); b.setAttribute("aria-controls", "tip"); tipBtn = b;
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && tip) { const b = tipBtn; closeTip(); b && b.focus(); } });
document.querySelector(".tablewrap").addEventListener("scroll", closeTip, {passive:true});
addEventListener("resize", closeTip);

/* ---------- coverage view: what is covered, what isn't, and why ---------- */
let COVERAGE = null, covLayer = null, mapMode = "leads";
const COV_COLOR = {covered:"--ok", gap:"--orange", "n/a":"--map-out-edge"};
async function loadCoverage() {
  if (COVERAGE) return COVERAGE;
  try { COVERAGE = await (await fetch("coverage.json")).json(); } catch (e) { COVERAGE = []; }
  return COVERAGE;
}
async function showCoverage() {
  const cov = await loadCoverage(), byFips = Object.fromEntries(cov.map(c => [c.fips, c]));
  if (covLayer) covLayer.remove();
  const counties = BASEMAP.features.filter(f => f.properties.kind === "counties");
  covLayer = L.geoJSON({type:"FeatureCollection", features:counties}, {renderer:baseRenderer, pane:"basemap",
    style: f => { const c = byFips[f.properties.fips];
      return {color:css("--map-out-edge"), weight:.5, fillColor: css(COV_COLOR[c ? c.status : "gap"]), fillOpacity: c && c.status === "n/a" ? .15 : .45}; },
    onEachFeature: (f, lyr) => { const c = byFips[f.properties.fips];
      lyr.bindTooltip(`<b>${esc(f.properties.name)}, ${esc(f.properties.st)}</b><br>${esc(c ? c.why : "Not in the target list")}`); }
  }).addTo(map);
  // cities over 25,000 are their own zoning authority: list them in the summary
  const states = {};
  cov.forEach(c => { const s = states[c.state] ||= {n:0, cov:0, pop:0, popCov:0, gaps:[]};
    if (c.status === "n/a") return;
    s.n++; s.pop += c.pop; if (c.status === "covered") { s.cov++; s.popCov += c.pop; } else s.gaps.push(c); });
  const all = cov.filter(c => c.status !== "n/a"), covered = all.filter(c => c.status === "covered");
  const reasons = {}; all.filter(c => c.status === "gap").forEach(c => { const k = c.why.split(" (")[0].replace(/^Uses .*/, "Uses an agenda system not read yet"); reasons[k] = (reasons[k] || 0) + 1; });
  const rows = Object.entries(states).filter(([st]) => $("#territory").value !== "bach" || BACH.has(st))
    .sort((a, b) => b[1].pop - a[1].pop);
  $("#detail").innerHTML = `<div class="cov-sum">
    <h3>Coverage</h3>
    <p>${covered.length.toLocaleString()} of ${all.length.toLocaleString()} counties and cities (over 25,000 people) are read automatically.
      Hover a county on the map to see why it is or isn't covered.</p>
    <p><strong>Why the rest aren't covered yet:</strong> ${Object.entries(reasons).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(k)} (${n.toLocaleString()})`).join("; ")}</p>
    <table><tr><th>State</th><th class="r">Governments covered</th><th>Share of people</th></tr>
    ${rows.map(([st, s]) => `<tr><td>${esc(STATE_NAMES[st] || st)}</td><td class="r num">${s.cov} of ${s.n}</td>
      <td><div class="cov-bar" title="${Math.round(100 * s.popCov / (s.pop || 1))}%"><i style="width:${Math.round(100 * s.popCov / (s.pop || 1))}%"></i></div></td></tr>`).join("")}
    </table></div>`;
  $("#map-key").innerHTML = `<span><i class="k-sq" style="background:var(--ok)"></i>Covered</span>
    <span><i class="k-sq" style="background:var(--orange)"></i>Not covered yet</span>
    <span><i class="k-sq" style="background:var(--map-out-edge)"></i>County doesn't zone</span>`;
  $("#map-note").textContent = `${Math.round(100 * covered.length / (all.length || 1))}% of governments covered`;
}
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
  mapMode = b.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
  if (mapMode === "coverage") { layer.remove(); showCoverage(); }
  else { if (covLayer) { covLayer.remove(); covLayer = null; } layer.addTo(map); $("#map-note").textContent = "";
         $("#detail").innerHTML = `<div class="placeholder">Pick a site from the list, the map or a hearing day to see the owner, the case and your team's notes.</div>`; render(); }
});
render();
</script>
</body></html>
